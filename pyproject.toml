[project]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<8",
  "uvicorn[standard]>=0.34,<1",
]
description = "IP risk scoring and address information service with shared API key pools"
name = "netools"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.2.0"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-redis>=4.6.0.20241004",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/netools"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["redis: requires a dedicated real Redis to validate Lua and integration behavior"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

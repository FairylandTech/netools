name: netools-deploy

services:
  netools:
    image: ${NETOOLS_IMAGE:-fairylandfuture/netools:0.1.0}
    container_name: netools-service
    restart: unless-stopped
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?Please set SERVICE_API_TOKEN in .env}
      SCAMALYTICS_KEYS_FILE: /run/secrets/scamalytics_keys
      IPREGISTRY_KEYS_FILE: /run/secrets/ipregistry_keys
      IPREGISTRY_QUOTA_SAFETY_MARGIN: ${IPREGISTRY_QUOTA_SAFETY_MARGIN:-5}
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-netools}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      QUOTA_REFRESH_SECONDS: ${QUOTA_REFRESH_SECONDS:-86400}
      QUOTA_SAFETY_MARGIN: ${QUOTA_SAFETY_MARGIN:-5}
      MAX_PROBES_PER_MONTH: ${MAX_PROBES_PER_MONTH:-60}
      MAX_PENDING_LOOKUPS: ${MAX_PENDING_LOOKUPS:-512}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-256}
      LOOKUP_TIMEOUT_SECONDS: ${LOOKUP_TIMEOUT_SECONDS:-15}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-5}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      KEY_WAIT_SECONDS: ${KEY_WAIT_SECONDS:-3}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      BATCH_WORKERS: ${BATCH_WORKERS:-32}
    secrets:
      - scamalytics_keys
      - ipregistry_keys
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)" ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: netools-redis-service
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  ipregistry_keys:
    file: ./config/ipregistry-keys.json
  scamalytics_keys:
    file: ./config/scamalytics-keys.json

volumes:
  redis-data:
